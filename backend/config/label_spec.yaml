# Label generation spec for supervised training.
# Frozen and hashed into the artifact manifest — changing any value here
# invalidates every trained artifact, which is the point.
#
# The primary head is `critical_composite_h180`. The horizon is 180 MINUTES,
# not 24 hours. The whitepaper's 24h critical composite is the real-data
# analogue; naming this head "24h" would be a false claim about what was
# measured on synthetic data.

label_spec:
  # Logistic model for P(critical):
  #   logit = beta0 + beta1*s_max_future + beta2*s_mean_future + beta3*frailty
  #
  # beta0 is SOLVED at generation time by bisection to hit target_prevalence;
  # the value here is only a fallback for callers that skip the solver.
  # Balance tuned empirically against the severity-oracle ceiling. beta3 is
  # deliberately small relative to beta1: at beta3=0.8 the frailty term's
  # variance exceeded the severity term's, which dragged the oracle down to
  # AUROC 0.676 — i.e. the label was mostly unpredictable noise and even a
  # perfect severity oracle could not do well. Measured ceilings:
  #   beta1=8,  beta3=0.50 -> oracle AUROC 0.808
  #   beta1=10, beta3=0.40 -> oracle AUROC 0.869   <- chosen
  #   beta1=14, beta3=0.25 -> oracle AUROC 0.907   (frailty nearly vestigial)
  beta0: -4.0
  beta1: 10.0       # peak future severity — the dominant term
  beta2: 4.0        # mean future severity — rewards sustained derangement
  beta3: 0.4        # frailty: outcome-only, NEVER touches a vital.
                    # This is what puts a hard floor under Bayes error, so no
                    # feature set can ever reach AUC 1.0.

  frailty_sd: 1.0

  # Clinically plausible for a critical composite in an ED population.
  # The whitepaper cites 1-3% for the very sickest; at N=20k that leaves ~200-600
  # positives, which is too thin for per-stratum fairness claims. 10% is a stated
  # compromise for prototype trainability, not a claim about real prevalence.
  target_prevalence: 0.10

  # Prediction index k is drawn uniformly in [k_min_step, k_max_step].
  # Features use steps <= k; labels use severity strictly after k.
  # 5-minute steps, so 6 -> 30 min and 18 -> 90 min.
  k_min_step: 6
  k_max_step: 18

  # Secondary head window: 12 steps = 60 minutes after k.
  short_horizon_steps: 12
