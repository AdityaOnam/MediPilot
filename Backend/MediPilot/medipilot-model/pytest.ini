[pytest]
# `speech` is deliberately absent: speech/test_whisper.py needs openai-whisper,
# torch and ffmpeg (requirements-speech-local.txt) and downloads model weights,
# so it would break a default `pytest` run for anyone on the served Groq path.
# Run it explicitly:  pytest speech/
testpaths = tests intake
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
