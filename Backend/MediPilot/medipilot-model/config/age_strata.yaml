# Age strata definitions for MediPilot triage model
# These are CONFIGURABLE — replaced by hospital-specific values during calibration.
# All ranges are inclusive. age_max_days: null means no upper bound.

strata:
  neonate:
    label: "Neonate"
    age_min_days: 0
    age_max_days: 27          # < 28 days
    vitals_normal:
      hr_min: 100
      hr_max: 180
      rr_min: 30
      rr_max: 60
      bp_sys_min: 60
      bp_sys_max: 90
      spo2_min: 95
      spo2_max: 100
      temp_c_min: 36.5
      temp_c_max: 37.5
      gcs_min: 15
      gcs_max: 15
      pain_score_min: 0
      pain_score_max: 3
    clinical_notes:
      - "Fever is emergency by default"
      - "Hypothermia as ominous as fever"
      - "Any temperature outside 36.5-37.5 triggers urgent review"
    calibration_weight: 1.8   # multiplier — normal vitals carry less reassurance
    reassurance_decay: 0.5    # how much normal vitals reduce risk estimate (0=none, 1=full)
    abnormal_vital_floor: 0.36  # min calibrated score (Yellow) when any vital is abnormal

  infant:
    label: "Infant"
    age_min_days: 28
    age_max_days: 364         # 28d – 1y
    vitals_normal:
      hr_min: 100
      hr_max: 160
      rr_min: 25
      rr_max: 50
      bp_sys_min: 70
      bp_sys_max: 100
      spo2_min: 95
      spo2_max: 100
      temp_c_min: 36.5
      temp_c_max: 37.5
      gcs_min: 15
      gcs_max: 15
      pain_score_min: 0
      pain_score_max: 3
    clinical_notes:
      - "Tachypnoea is earliest reliable sign"
      - "BP is very late sign of decompensation"
    calibration_weight: 1.5
    reassurance_decay: 0.55
    abnormal_vital_floor: 0.36  # min calibrated score (Yellow) when any vital is abnormal

  child:
    label: "Child"
    age_min_days: 365
    age_max_days: 4379        # 1y – 12y
    vitals_normal:
      hr_min: 70
      hr_max: 140
      rr_min: 18
      rr_max: 30
      bp_sys_min: 80
      bp_sys_max: 120
      spo2_min: 95
      spo2_max: 100
      temp_c_min: 36.5
      temp_c_max: 37.5
      gcs_min: 15
      gcs_max: 15
      pain_score_min: 0
      pain_score_max: 3
    clinical_notes:
      - "Compensates well then decompensates abruptly"
      - "Trend beats snapshot — weight trajectory over time"
    calibration_weight: 1.3
    reassurance_decay: 0.65
    # A child compensates well then decompensates abruptly, so an abnormal
    # vital is never dismissible — floor applies even though calibration_weight
    # alone (1.3) sits below what older thresholds used as an implicit cutoff.
    abnormal_vital_floor: 0.36  # min calibrated score (Yellow) when any vital is abnormal

  adolescent:
    label: "Adolescent"
    age_min_days: 4380
    age_max_days: 6569        # 12y – 18y
    vitals_normal:
      hr_min: 60
      hr_max: 110
      rr_min: 14
      rr_max: 22
      bp_sys_min: 90
      bp_sys_max: 130
      spo2_min: 95
      spo2_max: 100
      temp_c_min: 36.5
      temp_c_max: 37.5
      gcs_min: 15
      gcs_max: 15
      pain_score_min: 0
      pain_score_max: 3
    clinical_notes:
      - "Adult thresholds mostly apply"
      - "Pregnancy status becomes relevant"
    calibration_weight: 1.0
    reassurance_decay: 0.8
    abnormal_vital_floor: null  # reference-adjacent stratum — no floor

  adult:
    label: "Adult"
    age_min_days: 6570
    age_max_days: 23724       # 18y – 65y
    vitals_normal:
      hr_min: 60
      hr_max: 100
      rr_min: 12
      rr_max: 20
      bp_sys_min: 90
      bp_sys_max: 140
      spo2_min: 95
      spo2_max: 100
      temp_c_min: 36.5
      temp_c_max: 37.5
      gcs_min: 15
      gcs_max: 15
      pain_score_min: 0
      pain_score_max: 3
    clinical_notes:
      - "Reference stratum"
    calibration_weight: 1.0
    reassurance_decay: 0.85
    abnormal_vital_floor: null  # reference stratum — no floor

  geriatric:
    label: "Geriatric"
    age_min_days: 23725
    age_max_days: null        # 65y+
    vitals_normal:
      hr_min: 60
      hr_max: 100
      rr_min: 12
      rr_max: 20
      bp_sys_min: 90
      bp_sys_max: 150         # wider tolerable range
      spo2_min: 94
      spo2_max: 100            # slightly lower threshold clinically
      temp_c_min: 36.0        # hypothermia risk higher
      temp_c_max: 37.5
      gcs_min: 15
      gcs_max: 15
      pain_score_min: 0
      pain_score_max: 3
    clinical_notes:
      - "Normal vitals carry much weaker reassurance"
      - "Silent MI, afebrile sepsis, shock as confusion are all documented"
      - "Atypical presentation is the typical presentation"
    calibration_weight: 1.6   # normal-looking vitals get less credit
    reassurance_decay: 0.25   # very little reassurance from normal readings
    abnormal_vital_floor: 0.36  # min calibrated score (Yellow) when any vital is abnormal

# Widest-safety stratum used when age is unknown
unknown_age_fallback: "child"   # child has wide thresholds + elevated calibration weight
