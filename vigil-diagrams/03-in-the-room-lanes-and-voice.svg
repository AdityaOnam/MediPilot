<svg width="680" height="676" viewBox="0 0 680 676" role="img" xmlns="http://www.w3.org/2000/svg">
<title>What happens in the room: the bench, the four lanes, and the wall board</title>
<desc>At the triage bench the nurse speaks and the system listens and reads vitals back, without announcing anything aloud. One card produces one tap, which sets the patient into one of four lanes: red goes straight through with the bay pre-alerted, yellow waits but is re-checked on a clock and can only be moved up, green goes to fast track with a real wait estimate, and an unsure lane shows no recommendation and goes to the top of the nurse's list. A wall board shows colour columns, waiting time and direction of travel, and the hall speaker calls token numbers only.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:'Segoe UI',Arial,sans-serif;}
.t{font-size:14px;font-weight:400;fill:#1a1a1a;}
.ts{font-size:12px;font-weight:400;fill:#5f5e5a;}
.th{font-size:14px;font-weight:500;fill:#1a1a1a;}
.c-purple>rect,.c-purple>circle,.c-purple>ellipse{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.5;}
.c-purple>.th{fill:#3C3489;}.c-purple>.ts{fill:#534AB7;}
.c-teal>rect,.c-teal>circle,.c-teal>ellipse{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5;}
.c-teal>.th{fill:#085041;}.c-teal>.ts{fill:#0F6E56;}
.c-gray>rect,.c-gray>circle,.c-gray>ellipse{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.5;}
.c-gray>.th{fill:#444441;}.c-gray>.ts{fill:#5F5E5A;}
.c-red>rect,.c-red>circle,.c-red>ellipse{fill:#FCEBEB;stroke:#A32D2D;stroke-width:0.5;}
.c-red>.th{fill:#791F1F;}.c-red>.ts{fill:#A32D2D;}
.c-amber>rect,.c-amber>circle,.c-amber>ellipse{fill:#FAEEDA;stroke:#854F0B;stroke-width:0.5;}
.c-amber>.th{fill:#633806;}.c-amber>.ts{fill:#854F0B;}
.c-green>rect,.c-green>circle,.c-green>ellipse{fill:#EAF3DE;stroke:#3B6D11;stroke-width:0.5;}
.c-green>.th{fill:#27500A;}.c-green>.ts{fill:#3B6D11;}
</style>
</defs>
<rect x="0" y="0" width="680" height="676" fill="#ffffff"/>

<g class="c-gray"><rect x="40" y="40" width="600" height="100" rx="8"/><text class="th" x="340" y="64" text-anchor="middle">The triage bench</text><text class="ts" x="340" y="84" text-anchor="middle">The nurse speaks normally; the system listens and fills the form</text><text class="ts" x="340" y="102" text-anchor="middle">It reads the vitals back so she can correct it before it commits</text><text class="ts" x="340" y="120" text-anchor="middle">It never announces a level out loud where patients can hear</text></g>
<line x1="340" y1="140" x2="340" y2="152" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="c-purple"><rect x="190" y="156" width="300" height="58" rx="8"/><text class="th" x="340" y="180" text-anchor="middle">One card, one tap</text><text class="ts" x="340" y="200" text-anchor="middle">She accepts or overrides, then the lane is set</text></g>
<line x1="340" y1="214" x2="340" y2="234" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="244" width="600" height="292" rx="8" fill="none" stroke="#5f5e5a" stroke-width="0.5" stroke-dasharray="4 3" opacity="0.55"/>
<text class="th" x="56" y="266">Four lanes out of the bench</text>

<g class="c-red"><rect x="56" y="278" width="276" height="114" rx="8"/><text class="th" x="194" y="302" text-anchor="middle">Red — no queue at all</text><text class="ts" x="194" y="324" text-anchor="middle">Goes straight through the doors</text><text class="ts" x="194" y="342" text-anchor="middle">The bay is alerted first</text><text class="ts" x="194" y="360" text-anchor="middle">Past records pulled from ABHA</text><text class="ts" x="194" y="378" text-anchor="middle">The treatment clock starts</text></g>

<g class="c-amber"><rect x="348" y="278" width="276" height="114" rx="8"/><text class="th" x="486" y="302" text-anchor="middle">Yellow — waits, but watched</text><text class="ts" x="486" y="324" text-anchor="middle">This is where people die today</text><text class="ts" x="486" y="342" text-anchor="middle">Vitals re-checked on a set clock</text><text class="ts" x="486" y="360" text-anchor="middle">The machine can move her up</text><text class="ts" x="486" y="378" text-anchor="middle">It can never move her down</text></g>

<g class="c-green"><rect x="56" y="406" width="276" height="114" rx="8"/><text class="th" x="194" y="430" text-anchor="middle">Green — fast track</text><text class="ts" x="194" y="452" text-anchor="middle">Gets a real wait estimate</text><text class="ts" x="194" y="470" text-anchor="middle">Told early if the wait slips</text><text class="ts" x="194" y="488" text-anchor="middle">Still re-scored every 5 minutes</text><text class="ts" x="194" y="506" text-anchor="middle">Fewer people walk out angry</text></g>

<g class="c-teal"><rect x="348" y="406" width="276" height="114" rx="8"/><text class="th" x="486" y="430" text-anchor="middle">Not sure — no colour given</text><text class="ts" x="486" y="452" text-anchor="middle">The card shows no recommendation</text><text class="ts" x="486" y="470" text-anchor="middle">Goes to the top of her list</text><text class="ts" x="486" y="488" text-anchor="middle">Queue is never auto-sorted here</text><text class="ts" x="486" y="506" text-anchor="middle">A human decides, full stop</text></g>

<g class="c-gray"><rect x="40" y="556" width="600" height="100" rx="8"/><text class="th" x="340" y="580" text-anchor="middle">The wall board</text><text class="ts" x="340" y="600" text-anchor="middle">Colour columns, minutes waiting, and which way each patient is heading</text><text class="ts" x="340" y="618" text-anchor="middle">A watch list shows only the people whose risk is climbing</text><text class="ts" x="340" y="636" text-anchor="middle">The hall speaker calls token numbers only — never names or conditions</text></g>
</svg>
