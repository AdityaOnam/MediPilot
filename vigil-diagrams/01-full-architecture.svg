<svg width="680" height="1122" viewBox="0 0 680 1122" role="img" xmlns="http://www.w3.org/2000/svg">
<title>PatientTriage.ai end-to-end architecture</title>
<desc>A vertical flow from patient arrival through five layers — data capture, LLM structuring, a three-model risk engine, an honesty and uncertainty layer, decision and routing — ending at the nurse, who always decides. Two feedback loops run back up: a five-minute re-triage loop on the left and a learning loop on the right. A safety rails band sits below.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:'Segoe UI',Arial,sans-serif;}
.t{font-size:14px;font-weight:400;fill:#1a1a1a;}
.ts{font-size:12px;font-weight:400;fill:#5f5e5a;}
.th{font-size:14px;font-weight:500;fill:#1a1a1a;}
.c-purple>rect,.c-purple>circle,.c-purple>ellipse{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.5;}
.c-purple>.th{fill:#3C3489;}.c-purple>.ts{fill:#534AB7;}
.c-teal>rect,.c-teal>circle,.c-teal>ellipse{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5;}
.c-teal>.th{fill:#085041;}.c-teal>.ts{fill:#0F6E56;}
.c-gray>rect,.c-gray>circle,.c-gray>ellipse{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.5;}
.c-gray>.th{fill:#444441;}.c-gray>.ts{fill:#5F5E5A;}
</style>
</defs>
<rect x="0" y="0" width="680" height="1122" fill="#ffffff"/>

<g class="c-gray"><rect x="210" y="40" width="280" height="40" rx="8"/><text class="th" x="350" y="64" text-anchor="middle">Patient arrives at the ED</text></g>
<line x1="350" y1="80" x2="350" y2="92" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="150" y="96" width="400" height="162" rx="8" fill="none" stroke="#5f5e5a" stroke-width="0.5" stroke-dasharray="4 3" opacity="0.55"/>
<text class="th" x="166" y="118">Layer 0 · What we can capture in 5 minutes</text>
<g class="c-gray"><rect x="166" y="130" width="176" height="48" rx="4"/><text class="th" x="254" y="152" text-anchor="middle">First 60 seconds</text><text class="ts" x="254" y="170" text-anchor="middle">Age, how they came in</text></g>
<g class="c-gray"><rect x="358" y="130" width="176" height="48" rx="4"/><text class="th" x="446" y="152" text-anchor="middle">Minutes 1 to 3</text><text class="ts" x="446" y="170" text-anchor="middle">Vitals at the bench</text></g>
<g class="c-gray"><rect x="166" y="194" width="176" height="48" rx="4"/><text class="th" x="254" y="216" text-anchor="middle">Minutes 3 to 10</text><text class="ts" x="254" y="234" text-anchor="middle">ECG, notes, ABHA past</text></g>
<g class="c-gray"><rect x="358" y="194" width="176" height="48" rx="4"/><text class="th" x="446" y="216" text-anchor="middle">Ambient sensing</text><text class="ts" x="446" y="234" text-anchor="middle">Breathing, speech</text></g>
<line x1="350" y1="258" x2="350" y2="270" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="c-purple"><rect x="150" y="274" width="400" height="76" rx="8"/><text class="th" x="350" y="298" text-anchor="middle">Layer 1 · The LLM listens and structures</text><text class="ts" x="350" y="318" text-anchor="middle">Speech in any language becomes structured fields</text><text class="ts" x="350" y="336" text-anchor="middle">It never decides how sick the patient is</text></g>
<line x1="350" y1="350" x2="350" y2="362" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="150" y="366" width="400" height="144" rx="8" fill="none" stroke="#5f5e5a" stroke-width="0.5" stroke-dasharray="4 3" opacity="0.55"/>
<text class="th" x="166" y="388">Layer 2 · The risk engine</text>
<g class="c-purple"><rect x="166" y="400" width="113" height="48" rx="4"/><text class="th" x="222" y="422" text-anchor="middle">Numbers</text><text class="ts" x="222" y="440" text-anchor="middle">Vitals, age</text></g>
<g class="c-purple"><rect x="293" y="400" width="113" height="48" rx="4"/><text class="th" x="350" y="422" text-anchor="middle">Trends</text><text class="ts" x="350" y="440" text-anchor="middle">Over time</text></g>
<g class="c-purple"><rect x="420" y="400" width="113" height="48" rx="4"/><text class="th" x="476" y="422" text-anchor="middle">Words</text><text class="ts" x="476" y="440" text-anchor="middle">Complaint</text></g>
<g class="c-purple"><rect x="166" y="460" width="368" height="34" rx="4"/><text class="ts" x="350" y="481" text-anchor="middle">Works even if two of the three are missing</text></g>
<line x1="350" y1="510" x2="350" y2="522" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="c-teal"><rect x="150" y="526" width="400" height="76" rx="8"/><text class="th" x="350" y="550" text-anchor="middle">Layer 3 · The honesty layer</text><text class="ts" x="350" y="570" text-anchor="middle">Gives a range, and says when it is unsure</text><text class="ts" x="350" y="588" text-anchor="middle">Unfamiliar patient? It hands over to the nurse</text></g>
<line x1="350" y1="602" x2="350" y2="614" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="c-purple"><rect x="150" y="618" width="400" height="76" rx="8"/><text class="th" x="350" y="642" text-anchor="middle">Layer 4 · Decide and route</text><text class="ts" x="350" y="662" text-anchor="middle">Suggests level, room and orders, given ED load</text><text class="ts" x="350" y="680" text-anchor="middle">Hard rules hold: red never waits behind green</text></g>
<line x1="350" y1="694" x2="350" y2="706" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="c-teal"><rect x="150" y="710" width="400" height="76" rx="8"/><text class="th" x="350" y="734" text-anchor="middle">Layer 5 · The nurse decides</text><text class="ts" x="350" y="754" text-anchor="middle">One card, two reasons up, one reason down</text><text class="ts" x="350" y="772" text-anchor="middle">Accept, or override and say why</text></g>
<line x1="350" y1="786" x2="350" y2="798" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="c-gray"><rect x="150" y="802" width="400" height="58" rx="8"/><text class="th" x="350" y="826" text-anchor="middle">What actually happened</text><text class="ts" x="350" y="846" text-anchor="middle">ICU, admitted, home, or back within 72 hours</text></g>
<line x1="350" y1="860" x2="350" y2="872" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="c-gray"><rect x="150" y="876" width="400" height="76" rx="8"/><text class="th" x="350" y="900" text-anchor="middle">The learning loop</text><text class="ts" x="350" y="920" text-anchor="middle">Overrides and outcomes become training labels</text><text class="ts" x="350" y="938" text-anchor="middle">Hospitals train together, raw data never leaves</text></g>

<g class="c-gray"><rect x="40" y="400" width="104" height="44" rx="4"/><text class="ts" x="92" y="422" text-anchor="middle">Re-triage</text><text class="ts" x="92" y="438" text-anchor="middle">every 5 min</text></g>
<path d="M150 754 H92 V444" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-dasharray="5 4"/>
<path d="M92 400 V173 H146" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<path d="M550 914 H605 V438 H554" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

<g class="c-teal"><rect x="150" y="990" width="400" height="112" rx="8"/><text class="th" x="350" y="1014" text-anchor="middle">Safety rails around everything</text><text class="ts" x="350" y="1034" text-anchor="middle">It may escalate alone, never downgrade alone</text><text class="ts" x="350" y="1052" text-anchor="middle">No network? The bench box keeps working</text><text class="ts" x="350" y="1070" text-anchor="middle">Model down? Falls back to the paper rule card</text></g>
</svg>
