<svg width="680" height="878" viewBox="0 0 680 878" role="img" xmlns="http://www.w3.org/2000/svg">
<title>What happens after the risk engine</title>
<desc>A fused risk score is calibrated, converted into a range rather than a single guess, then passed through a confidence gate. Low-confidence cases step back and show no recommendation. Confident cases get a level chosen by cost, then turned into a concrete instruction, which splits into an autonomous queue re-order and a card that waits for the nurse. Both end at the nurse's recorded decision.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:'Segoe UI',Arial,sans-serif;}
.t{font-size:14px;font-weight:400;fill:#1a1a1a;}
.ts{font-size:12px;font-weight:400;fill:#5f5e5a;}
.th{font-size:14px;font-weight:500;fill:#1a1a1a;}
.c-purple>rect,.c-purple>circle,.c-purple>ellipse{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.5;}
.c-purple>.th{fill:#3C3489;}.c-purple>.ts{fill:#534AB7;}
.c-teal>rect,.c-teal>circle,.c-teal>ellipse{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5;}
.c-teal>.th{fill:#085041;}.c-teal>.ts{fill:#0F6E56;}
.c-gray>rect,.c-gray>circle,.c-gray>ellipse{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.5;}
.c-gray>.th{fill:#444441;}.c-gray>.ts{fill:#5F5E5A;}
</style>
</defs>
<rect x="0" y="0" width="680" height="878" fill="#ffffff"/>

<g class="c-gray"><rect x="150" y="40" width="380" height="58" rx="8"/><text class="th" x="340" y="64" text-anchor="middle">Fused risk from Layer 2</text><text class="ts" x="340" y="84" text-anchor="middle">0.71 chance of a critical event in 24 hours</text></g>
<line x1="340" y1="98" x2="340" y2="110" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="c-purple"><rect x="150" y="114" width="380" height="76" rx="8"/><text class="th" x="340" y="138" text-anchor="middle">Step 1 · Calibrate the number</text><text class="ts" x="340" y="158" text-anchor="middle">Turns a raw score into a real probability</text><text class="ts" x="340" y="176" text-anchor="middle">Re-checked at every hospital separately</text></g>
<line x1="340" y1="190" x2="340" y2="202" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="c-purple"><rect x="150" y="206" width="380" height="76" rx="8"/><text class="th" x="340" y="230" text-anchor="middle">Step 2 · Turn one guess into a range</text><text class="ts" x="340" y="250" text-anchor="middle">Outputs Red or Yellow, not one answer</text><text class="ts" x="340" y="268" text-anchor="middle">The truth sits inside it 9 times in 10</text></g>
<line x1="340" y1="282" x2="340" y2="294" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="c-teal"><rect x="150" y="298" width="380" height="58" rx="8"/><text class="th" x="340" y="322" text-anchor="middle">Step 3 · Is it confident enough?</text><text class="ts" x="340" y="342" text-anchor="middle">Range too wide? Patient unlike any before?</text></g>
<path d="M250 356 V372 H212 V386" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M430 356 V372 H477 V386" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="c-teal"><rect x="90" y="390" width="245" height="76" rx="8"/><text class="th" x="212" y="414" text-anchor="middle">No — it steps back</text><text class="ts" x="212" y="434" text-anchor="middle">No recommendation shown</text><text class="ts" x="212" y="452" text-anchor="middle">Card says: needs your eyes</text></g>
<g class="c-purple"><rect x="355" y="390" width="245" height="76" rx="8"/><text class="th" x="477" y="414" text-anchor="middle">Yes — it commits</text><text class="ts" x="477" y="434" text-anchor="middle">Goes on to the next steps</text><text class="ts" x="477" y="452" text-anchor="middle">About 85 in every 100</text></g>
<line x1="477" y1="466" x2="477" y2="486" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M212 466 V686" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

<g class="c-purple"><rect x="340" y="490" width="280" height="76" rx="8"/><text class="th" x="480" y="514" text-anchor="middle">Step 4 · Pick the level</text><text class="ts" x="480" y="534" text-anchor="middle">A miss costs 100x a false alarm</text><text class="ts" x="480" y="552" text-anchor="middle">Each hospital sets the ratio</text></g>
<line x1="480" y1="566" x2="480" y2="578" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="c-purple"><rect x="340" y="582" width="280" height="76" rx="8"/><text class="th" x="480" y="606" text-anchor="middle">Step 5 · Make it actionable</text><text class="ts" x="480" y="626" text-anchor="middle">Picks a bay, given free beds</text><text class="ts" x="480" y="644" text-anchor="middle">Hard rules beat the optimiser</text></g>
<path d="M400 658 V675 H212 V686" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="560" y1="658" x2="560" y2="686" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="c-teal"><rect x="90" y="692" width="245" height="76" rx="8"/><text class="th" x="212" y="716" text-anchor="middle">Waits for a human</text><text class="ts" x="212" y="736" text-anchor="middle">The card reaches the nurse</text><text class="ts" x="212" y="754" text-anchor="middle">Accept, or override</text></g>
<g class="c-gray"><rect x="380" y="692" width="240" height="76" rx="8"/><text class="th" x="500" y="716" text-anchor="middle">Happens by itself</text><text class="ts" x="500" y="736" text-anchor="middle">The waiting queue re-orders</text><text class="ts" x="500" y="754" text-anchor="middle">Only ever moves people up</text></g>

<path d="M212 768 V784 H340 V796" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M500 768 V784 H340" fill="none" stroke="#444441" stroke-width="1.5"/>

<g class="c-teal"><rect x="150" y="800" width="380" height="58" rx="8"/><text class="th" x="340" y="824" text-anchor="middle">The nurse's call is the record</text><text class="ts" x="340" y="844" text-anchor="middle">Their override becomes training data</text></g>
</svg>
