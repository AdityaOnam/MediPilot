  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"4b1f0cd3-7dc1-474c-9bfe-2fb349a1ff34\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"7f6ffc93-f871-42e2-80f9-c79dc1da99e7\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 700;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"a078e8c3-ecf9-4dff-9d2a-1f759119f7d5\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  body { margin: 0; font-family: Archivo, system-ui, sans-serif; background: #111111; }\n  a { color: #A100FF; text-decoration: none; }\n  a:hover { color: #6F00B8; }\n  @keyframes mp-bob { 0%, 100% { transform: translateY(0) rotate(-0.6deg); } 50% { transform: translateY(-14px) rotate(0.8deg); } }\n  @keyframes mp-shadow { 0%, 100% { transform: scaleX(1); opacity: 0.22; } 50% { transform: scaleX(0.82); opacity: 0.12; } }\n  @keyframes mp-pop { 0% { transform: scale(0.94) translateY(6px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }\n  @keyframes mp-dot { 0%, 60%, 100% { opacity: 0.25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-5px); } }\n  @keyframes mp-caret { 0%, 45% { opacity: 1; } 55%, 100% { opacity: 0; } }\n  @keyframes mp-nod { 0%, 100% { transform: translateY(0) rotate(0deg); } 25% { transform: translateY(-8px) rotate(-3deg); } 60% { transform: translateY(-2px) rotate(3deg); } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<x-import component-from-global-scope=\"deck-stage\" from=\"d6ef128d-45f3-4553-97bb-1db108bc31ac#/deck-stage.js\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\">\n\n  <section data-label=\"9pm\" data-screen-label=\"01\" data-speaker-notes=\"A 71-year-old woman walks into a district hospital at 9pm. Heavy chest, tired for two days. No fever. No dramatic pain. The nurse — the only one on the floor — marks her routine and moves to the next of forty people. Four hours later, nobody has looked at her again.\" style=\"background: #FFFFFF; color: #111111; padding: 88px 100px 80px; display: flex; flex-direction: column; gap: 40px;\">\n    <div style=\"display: flex; align-items: flex-start; justify-content: flex-end;\">\n      <img src=\"8c10ae1f-67d6-4048-9c32-da2b7f7013aa\" alt=\"Accenture\" style=\"height: 64px; width: auto;\">\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; align-items: center; gap: 26px; margin: auto 0;\">\n      <img src=\"c6dd7247-29a4-4e1b-b88f-209d48b45dfc\" alt=\"MediPilot — AI-powered patient triage assistant\" style=\"height: 300px; width: auto;\">\n      <p style=\"margin: 0; font-size: 56px; font-weight: 600; line-height: 1.2; letter-spacing: -0.02em; text-align: center;\">9pm. District hospital. 71 years old.<\u002Fp>\n      <p style=\"margin: 0; font-size: 56px; font-weight: 600; line-height: 1.2; letter-spacing: -0.02em; color: #666666; text-align: center;\">Heavy chest, tired for two days. No fever.<\u002Fp>\n      <p style=\"margin: 0; font-size: 56px; font-weight: 600; line-height: 1.2; letter-spacing: -0.02em; color: #A100FF; text-align: center;\">One nurse. Forty patients. Four hours unwatched.<\u002Fp>\n    <\u002Fdiv>\n    <p style=\"margin: auto 0 0; font-size: 28px; letter-spacing: 0.14em; text-transform: uppercase; color: #666666;\">Team 01 BIT · Indian Institute of Technology, Patna · Accenture Innovation Challenge<\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"Triage happens once\" data-screen-label=\"02\" data-speaker-notes=\"Two things went wrong, and neither was the nurse's fault. One person under pressure made the call in ninety seconds. And triage happens once — after that, the corridor is unwatched. This board is live: risk keeps climbing, and nothing on it changes.\" style=\"background: #FFFFFF; color: #111111; padding: 88px 100px 72px; display: flex; flex-direction: column; gap: 28px;\">\n    <div style=\"display: flex; align-items: flex-end; justify-content: space-between; gap: 40px;\">\n      <span style=\"font-size: 28px; letter-spacing: 0.16em; text-transform: uppercase; color: #A100FF;\">The gap<\u002Fspan>\n      <div style=\"display: flex; align-items: flex-end; gap: 22px; flex-direction: row-reverse;\">\n        <div style=\"position: relative; flex: none; display: flex; flex-direction: column; align-items: center;\">\n          <img src=\"b4c09ea3-6eac-4ff8-a17e-5bee5fb022f1\" alt=\"MediPilot mascot\" style=\"height: 150px; width: auto; display: block; animation: mp-bob 3.4s ease-in-out infinite; transform-origin: 50% 90%;\">\n          <span style=\"display: block; width: 66px; height: 12px; border-radius: 50%; background: #111111; opacity: 0.18; margin-top: -6px; animation: mp-shadow 3.4s ease-in-out infinite;\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"position: relative; margin-bottom: 26px; border: 2px solid #A100FF; border-radius: 6px; background: #FFFFFF; padding: 18px 24px; max-width: 640px; box-shadow: 0 6px 20px rgba(17,17,17,0.06); animation: mp-pop 320ms ease-out both;\">\n          <span style=\"position: absolute; bottom: 16px; right: -11px; width: 18px; height: 18px; background: #FFFFFF; border-right: 2px solid #A100FF; border-bottom: 2px solid #A100FF; transform: rotate(-45deg); display: block;\"><\u002Fspan>\n          <p style=\"margin: 0; font-size: 28px; line-height: 1.35; color: #111111; text-wrap: pretty;\">{{ m2Shown }}<sc-if value=\"{{ m2Typing }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"display: inline-block; width: 3px; height: 26px; background: #A100FF; vertical-align: -4px; margin-left: 4px; animation: mp-caret 900ms steps(1, end) infinite;\"><\u002Fspan><\u002Fsc-if><\u002Fp>\n          <sc-if value=\"{{ m2Typing }}\" hint-placeholder-val=\"{{ true }}\">\n            <span style=\"display: flex; gap: 7px; margin-top: 12px;\">\n              <span style=\"width: 8px; height: 8px; border-radius: 50%; background: #A100FF; display: block; animation: mp-dot 1.1s ease-in-out infinite;\"><\u002Fspan>\n              <span style=\"width: 8px; height: 8px; border-radius: 50%; background: #A100FF; display: block; animation: mp-dot 1.1s ease-in-out 0.16s infinite;\"><\u002Fspan>\n              <span style=\"width: 8px; height: 8px; border-radius: 50%; background: #A100FF; display: block; animation: mp-dot 1.1s ease-in-out 0.32s infinite;\"><\u002Fspan>\n            <\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <h2 style=\"margin: 0; font-size: 64px; font-weight: 600; letter-spacing: -0.02em;\">Triage happens once<\u002Fh2>\n    <div style=\"display: flex; flex-direction: column; gap: 8px; width: 100%;\">\n      <div style=\"display: flex; align-items: center; justify-content: space-between;\">\n        <span style=\"font-size: 28px; letter-spacing: 0.14em; text-transform: uppercase; color: #A100FF;\">Tonight, without MediPilot<\u002Fspan>\n        <span style=\"font-size: 28px; color: #666666;\">{{ queueUnwatchedClock }}<\u002Fspan>\n      <\u002Fdiv>\n      <sc-for list=\"{{ queueUnwatched }}\" as=\"row\" hint-placeholder-count=\"4\">\n        <div style=\"display: grid; grid-template-columns: 170px 150px 1fr 300px; align-items: center; gap: 28px; border: 1px solid #E2E2E2; border-left: 10px solid; border-left-color: {{ row.color }}; border-radius: 4px; padding: 9px 26px; background: #FFFFFF;\">\n          <span style=\"font-size: 28px; font-weight: 600; color: #111111;\">{{ row.token }}<\u002Fspan>\n          <span style=\"font-size: 28px; color: #666666;\">{{ row.wait }}<\u002Fspan>\n          <span style=\"display: block; height: 18px; border-radius: 9px; background: #F2F2F2; overflow: hidden;\"><span style=\"display: block; height: 18px; border-radius: 9px; width: {{ row.pct }}%; background: {{ row.color }};\"><\u002Fspan><\u002Fspan>\n          <span style=\"font-size: 28px; font-weight: 600; color: {{ row.color }};\">{{ row.note }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"margin: auto 0 0; font-size: 34px; line-height: 1.4; border-top: 3px solid #111111; padding-top: 24px; text-wrap: pretty;\">One person under pressure makes the call in ninety seconds — and nothing is watching for change after it.<\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"Why past AI failed\" data-screen-label=\"03\" data-speaker-notes=\"AI has already been tried here and failed badly. A sepsis model deployed across hundreds of hospitals missed two out of three cases and fired a hundred and nine false alarms for every real one. It wasn't predicting illness. It was detecting that a doctor had already guessed.\" style=\"background: #FFFFFF; color: #111111; padding: 88px 100px 72px; display: flex; flex-direction: column; gap: 52px;\">\n    <div style=\"display: flex; align-items: flex-end; justify-content: space-between; gap: 40px;\">\n      <span style=\"font-size: 28px; letter-spacing: 0.16em; text-transform: uppercase; color: #A100FF;\">Prior art<\u002Fspan>\n      <div style=\"display: flex; align-items: flex-end; gap: 22px; flex-direction: row-reverse;\">\n        <div style=\"position: relative; flex: none; display: flex; flex-direction: column; align-items: center;\">\n          <img src=\"b4c09ea3-6eac-4ff8-a17e-5bee5fb022f1\" alt=\"MediPilot mascot\" style=\"height: 140px; width: auto; display: block; animation: mp-bob 3.4s ease-in-out infinite; transform-origin: 50% 90%;\">\n          <span style=\"display: block; width: 62px; height: 12px; border-radius: 50%; background: #111111; opacity: 0.18; margin-top: -6px; animation: mp-shadow 3.4s ease-in-out infinite;\"><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"position: relative; margin-bottom: 26px; border: 2px solid #A100FF; border-radius: 6px; background: #FFFFFF; padding: 18px 24px; max-width: 640px; box-shadow: 0 6px 20px rgba(17,17,17,0.06); animation: mp-pop 320ms ease-out both;\">\n          <span style=\"position: absolute; bottom: 16px; right: -11px; width: 18px; height: 18px; background: #FFFFFF; border-right: 2px solid #A100FF; border-bottom: 2px solid #A100FF; transform: rotate(-45deg); display: block;\"><\u002Fspan>\n          <p style=\"margin: 0; font-size: 28px; line-height: 1.35; color: #111111; text-wrap: pretty;\">{{ m3Shown }}<sc-if value=\"{{ m3Typing }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"display: inline-block; width: 3px; height: 26px; background: #A100FF; vertical-align: -4px; margin-left: 4px; animation: mp-caret 900ms steps(1, end) infinite;\"><\u002Fspan><\u002Fsc-if><\u002Fp>\n          <sc-if value=\"{{ m3Typing }}\" hint-placeholder-val=\"{{ true }}\">\n            <span style=\"display: flex; gap: 7px; margin-top: 12px;\">\n              <span style=\"width: 8px; height: 8px; border-radius: 50%; background: #A100FF; display: block; animation: mp-dot 1.1s ease-in-out infinite;\"><\u002Fspan>\n              <span style=\"width: 8px; height: 8px; border-radius: 50%; background: #A100FF; display: block; animation: mp-dot 1.1s ease-in-out 0.16s infinite;\"><\u002Fspan>\n              <span style=\"width: 8px; height: 8px; border-radius: 50%; background: #A100FF; display: block; animation: mp-dot 1.1s ease-in-out 0.32s infinite;\"><\u002Fspan>\n            <\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <h2 style=\"margin: 0; font-size: 64px; font-weight: 600; letter-spacing: -0.02em;\">Why hospital AI has failed here before<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px;\">\n      <div style=\"background: #F7F7F7; border: 1px solid #E2E2E2; border-radius: 4px; padding: 44px 40px; display: flex; flex-direction: column; gap: 14px;\">\n        <span style=\"font-size: 100px; font-weight: 700; letter-spacing: -0.03em; color: #A100FF;\">0.63<\u002Fspan>\n        <span style=\"font-size: 28px; color: #666666;\">AUC in real deployment<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background: #F7F7F7; border: 1px solid #E2E2E2; border-radius: 4px; padding: 44px 40px; display: flex; flex-direction: column; gap: 14px;\">\n        <span style=\"font-size: 100px; font-weight: 700; letter-spacing: -0.03em; color: #A100FF;\">2 in 3<\u002Fspan>\n        <span style=\"font-size: 28px; color: #666666;\">sepsis cases missed<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background: #F7F7F7; border: 1px solid #E2E2E2; border-radius: 4px; padding: 44px 40px; display: flex; flex-direction: column; gap: 14px;\">\n        <span style=\"font-size: 100px; font-weight: 700; letter-spacing: -0.03em; color: #A100FF;\">109<\u002Fspan>\n        <span style=\"font-size: 28px; color: #666666;\">false alarms per real one<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin: 0; font-size: 44px; line-height: 1.35; max-width: 1500px; text-wrap: pretty;\">It wasn't predicting illness. It was detecting that a doctor had already guessed.<\u002Fp>\n    <p style=\"margin: auto 0 0; font-size: 28px; color: #666666;\">Epic Sepsis Model, external validation across 27,697 patients<\u002Fp>\n  <\u002Fsection>\n\n  <section data-label=\"The one rule\" data-screen-label=\"04\" data-speaker-notes=\"So we built MediPilot around one rule. It can move a patient up the queue on its own. It can never move one down on its own. Escalation is a warning. De-escalation is a decision — try moving this patient down and the card asks the nurse for a reason.\" style=\"background: #FFFFFF; color: #111111; padding: 88px 100px 72px; display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center;\">\n    <div style=\"display: flex; flex-direction: column; gap: 36px;\">\n      <span style=\"font-size: 28px; letter-spacing: 0.16em; text-transform: uppercase; color: #A100FF;\">The rule<\u002Fspan>\n      <p style=\"margin: 0; font-size: 68px; font-weight: 600; line-height: 1.15; letter-spacing: -0.025em; text-wrap: pretty;\">It can move a patient up on its own. It can <span style=\"color: #A100FF;\">never<\u002Fspan> move one down on its own.<\u002Fp>\n      <p style=\"margin: 0; font-size: 34px; color: #666666; line-height: 1.4; text-wrap: pretty;\">Escalation is a warning. De-escalation is a decision — and decisions stay with the nurse. Her override is what gets recorded, and what trains the next model.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; gap: 12px; width: 100%; font-family: Archivo, system-ui, sans-serif; border: 1px solid #E2E2E2; border-radius: 4px; background: #FFFFFF; padding: 28px 32px;\">\n      <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 20px;\">\n        <span style=\"display: flex; align-items: flex-end; gap: 14px;\">\n          <span style=\"display: flex; flex-direction: column; align-items: center; flex: none;\">\n            <img src=\"b4c09ea3-6eac-4ff8-a17e-5bee5fb022f1\" alt=\"MediPilot\" style=\"height: 96px; width: auto; display: block; animation: mp-bob 3.4s ease-in-out infinite; transform-origin: 50% 90%;\">\n            <span style=\"display: block; width: 42px; height: 9px; border-radius: 50%; background: #111111; opacity: 0.16; margin-top: -4px; animation: mp-shadow 3.4s ease-in-out infinite;\"><\u002Fspan>\n          <\u002Fspan>\n          <span style=\"font-size: 28px; letter-spacing: 0.14em; text-transform: uppercase; color: #A100FF; padding-bottom: 14px;\">Nurse card · she decides<\u002Fspan>\n        <\u002Fspan>\n        <span style=\"font-size: 28px; color: #666666;\">{{ rule_stageLabel }}<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin: 0; font-size: 34px; line-height: 1.35; color: #111111; min-height: 64px; text-wrap: pretty;\">{{ rule_transcript }}<\u002Fp>\n      <sc-if value=\"{{ rule_showFields }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px;\">\n          <div style=\"background: #F7F7F7; border-radius: 4px; padding: 11px 16px; display: flex; flex-direction: column; gap: 2px;\"><span style=\"font-size: 28px; color: #666666;\">Age<\u002Fspan><span style=\"font-size: 28px; font-weight: 600;\">71<\u002Fspan><\u002Fdiv>\n          <div style=\"background: #F7F7F7; border-radius: 4px; padding: 11px 16px; display: flex; flex-direction: column; gap: 2px;\"><span style=\"font-size: 28px; color: #666666;\">Pulse<\u002Fspan><span style=\"font-size: 28px; font-weight: 600;\">110<\u002Fspan><\u002Fdiv>\n          <div style=\"background: #F7F7F7; border-radius: 4px; padding: 11px 16px; display: flex; flex-direction: column; gap: 2px;\"><span style=\"font-size: 28px; color: #666666;\">BP<\u002Fspan><span style=\"font-size: 28px; font-weight: 600;\">90/60<\u002Fspan><\u002Fdiv>\n          <div style=\"background: #F7F7F7; border-radius: 4px; padding: 11px 16px; display: flex; flex-direction: column; gap: 2px;\"><span style=\"font-size: 28px; color: #666666;\">SpO₂<\u002Fspan><span style=\"font-size: 28px; font-weight: 600;\">93%<\u002Fspan><\u002Fdiv>\n          <div style=\"background: #F7F7F7; border-radius: 4px; padding: 11px 16px; display: flex; flex-direction: column; gap: 2px;\"><span style=\"font-size: 28px; color: #666666;\">Fever<\u002Fspan><span style=\"font-size: 28px; font-weight: 600;\">None<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-for list=\"{{ rule_answered }}\" as=\"qa\" hint-placeholder-count=\"0\">\n        <div style=\"display: flex; align-items: baseline; gap: 16px; font-size: 28px; color: #666666;\">\n          <span style=\"color: #A100FF;\">asked<\u002Fspan><span>{{ qa.q }}<\u002Fspan><span style=\"color: #111111; font-weight: 600;\">{{ qa.a }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <sc-if value=\"{{ rule_asking }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display: flex; align-items: center; gap: 20px; border: 2px solid #A100FF; border-radius: 4px; padding: 18px 22px; flex-wrap: wrap;\">\n          <img src=\"b4c09ea3-6eac-4ff8-a17e-5bee5fb022f1\" alt=\"MediPilot\" style=\"height: 104px; width: auto; margin: -14px 0; animation: mp-nod 1.6s ease-in-out infinite;\">\n          <span style=\"font-size: 34px; font-weight: 600; color: #111111; flex: 1; min-width: 380px; text-wrap: pretty;\">{{ rule_question }}<\u002Fspan>\n          <button type=\"button\" sc-camel-on-click=\"{{ rule_answerYes }}\" style=\"font-family: Archivo, system-ui, sans-serif; font-size: 28px; font-weight: 600; color: #FFFFFF; background: #A100FF; border: 2px solid #A100FF; border-radius: 4px; padding: 12px 26px; cursor: pointer;\" style-hover=\"background: #6F00B8; border-color: #6F00B8;\">Yes<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ rule_answerNo }}\" style=\"font-family: Archivo, system-ui, sans-serif; font-size: 28px; font-weight: 600; color: #111111; background: #FFFFFF; border: 2px solid #111111; border-radius: 4px; padding: 12px 26px; cursor: pointer;\" style-hover=\"background: #F2F2F2;\">No<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ rule_showRisk }}\" hint-plac   <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ rule_askReason }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: center; background: #F7F7F7; border-radius: 4px; padding: 18px 22px;\">\n          <span style=\"font-size: 28px; font-weight: 600; color: #111111;\">Reason required — nurse only:<\u002Fspan>\n          <button type=\"button\" sc-camel-on-click=\"{{ rule_reasonA }}\" style=\"font-family: Archivo, system-ui, sans-serif; font-size: 28px; color: #111111; background: #FFFFFF; border: 1px solid #D9D9D9; border-radius: 4px; padding: 10px 18px; cursor: pointer;\" style-hover=\"border-color: #A100FF;\">Vitals improved<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ rule_reasonB }}\" style=\"font-family: Archivo, system-ui, sans-serif; font-size: 28px; color: #111111; background: #FFFFFF; border: 1px solid #D9D9D9; border-radius: 4px; padding: 10px 18px; cursor: pointer;\" style-hover=\"border-color: #A100FF;\">Pain settled<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ rule_reasonC }}\" style=\"font-family: Archivo, system-ui, sans-serif; font-size: 28px; color: #111111; background: #FFFFFF; border: 1px solid #D9D9D9; border-radius: 4px; padding: 10px 18px; cursor: pointer;\" style-hover=\"border-color: #A100FF;\">Known chronic<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <p style=\"margin: 0; font-size: 28px; font-weight: 600; color: #6F00B8; min-height: 38px;\">{{ rule_status }}<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"At the bench\" data-screen-label=\"05\" data-speaker-notes=\"At the bench the nurse just talks. Speech in any language becomes a filled form, read back before it commits. Three small models then read the numbers, the trend in the numbers, and the words — and it still works if two of the three are missing.\" style=\"background: #FFFFFF; color: #111111; padding: 88px 100p pan style=\"font-size: 28px; color: #666666;\">Only model updates travel; patient data never leaves the building<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Nobody waits unseen\" data-screen-label=\"08\" data-speaker-notes=\"Under five rupees a patient. Six weeks to install. Twelve times more re-assessments per patient, and zero automatic de-escalations. It doesn't replace her judgment — it makes sure somebody comes back to check on the woman in the corridor. Nobody should die waiting to be noticed.\" style=\"background: #FFFFFF; color: #111111; padding: 88px 100px 72px; display: flex; flex-direction: column; gap: 44px;\">\n    <div style=\"display: flex; align-items: flex-start; justify-content: flex-end;\">\n      <img src=\"8c10ae1f-67d6-4048-9c32-da2b7f7013aa\" alt=\"Accenture\" style=\"height: 64px; width: auto;\">\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; align-items: center; gap: 18px; margin-top: -20px;\">\n      <img src=\"c6dd7247-29a4-4e1b-b88f-209d48b45dfc\" alt=\"MediPilot — AI-powered patient triage assistant\" style=\"height: 280px; width: auto;\">\n      <p style=\"margin: 0; font-size: 80px; font-weight: 600; letter-spacing: -0.025em; color: #6F00B8; text-align: center;\">Nobody waits unseen.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px; border-top: 3px solid #111111; padding-top: 40px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n        <span style=\"font-size: 76px; font-weight: 700; letter-spacing: -0.03em;\">&lt; ₹5<\u002Fspan>\n        <span style=\"font-size: 28px; color: #666666;\">per patient<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n        <span style=\"font-size: 76px; font-weight: 700; letter-spacing: -0.03em;\">6 weeks<\u002Fspan>\n        <span style=\"font-size: 28px; color: #666666;\">to install in a district hospital<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n        <span style=\"font-size: 76px; font-weight: 700; letter-spacing: -0.03em;\">12×<\u002Fspan>\n        <span style=\"font-size: 28px; color: #666666;\">re-assessments per patient<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n        <span style=\"font-size: 76px; font-weight: 700; letter-spacing: -0.03em;\">0<\u002Fspan>\n        <span style=\"font-size: 28px; color: #666666;\">automatic de-escalations, ever<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin: auto 0 0; font-size: 28px; letter-spacing: 0.14em; text-transform: uppercase; color: #666666;\">Team 01 BIT · Indian Institute of Technology, Patna · Accenture Innovation Challenge<\u002Fp>\n  <\u002Fsection>\n\n<\u002Fx-import>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    mLines: { m2: 0, m3: 0, m7: 0 },\n    q: { t: 0 },\n    cards: {\n      rule: { c: 0, phase: \"talk\", qi: 0, answers: [], decision: \"\", askReason: false },\n      bench: { c: 0, phase: \"talk\", qi: 0, answers: [], decision: \"\", askReason: false },\n      unsure: { c: 0, phase: \"talk\", qi: 0, answers: [], decision: \"\", askReason: false }\n    }\n  };\n\n  mascotLines = {\n    m2: \"This is tonight, without me. Her risk keeps moving — the board never does.\",\n    m3: \"I would rather say nothing than cry wolf a hundred times a night.\",\n    m7: \"Every five minutes I check on everyone still waiting.\"\n  };\n\n  cardWords = \"Seventy-one, walked in with her son, chest feels heavy since Tuesday, tired, no fever, pulse is fast.\".split(\" \");\n  cardQuestions = [\"Does the heaviness spread to her arm or jaw?\", \"Has she been breathless lying flat at night?\"];\n\n  componentDidMount() {\n    this._ivs = {};\n    Object.keys(this.mascotLines).forEach(k => this.runMascot(k));\n    this.seedQueue();\n    this._ivs.q = setInterval(() => this.tickQueue(), 1100);\n    Object.keys(this.state.cards).forEach(k => this.runCard(k));\n  }\n\n  componentWillUnmount() {\n    Object.values(this._ivs || {}).forEach(clearInterval);\n    Object.values(this._tos || {}).forEach(clearTimeout);\n  }\n\n  runMascot(k) {\n    clearInterval(this._ivs[\"m_\" + k]);\n    this.setState(s => ({ mLines: { ...s.mLines, [k]: 0 } }));\n    this._ivs[\"m_\" + k] = setInterval(() => {\n      this.setState(s => {\n        if (s.mLines[k] >= this.mascotLines[k].length) { clearInterval(this._ivs[\"m_\" + k]); return {}; }\n        return { mLines: { ...s.mLines, [k]: s.mLines[k] + 1 } };\n      });\n    }, 34);\n  }\n\n  seedQueue() {\n    this.pts = [\n      { token: \"T-108\", risk: 0.34, mins: 20, drift: 0.055 },\n      { token: \"T-112\", risk: 0.18, mins: 35, drift: 0.006 },\n      { token: \"T-117\", risk: 0.5, mins: 12, drift: 0.03 },\n      { token: \"T-120\", risk: 0.42, mins: 8, drift: 0.022, unsure: true }\n    ];\n    this.pts.forEach(p => { p.startLane = this.lane(p.risk); });\n  }\n\n  lane(r) { return r >= 0.7 ? 2 : r >= 0.4 ? 1 : 0; }\n\n  tickQueue() {\n    this.pts.forEach(p => { p.mins += 5; p.risk = Math.min(0.96, p.risk + p.drift); });\n    if (this.pts[0].mins > 200) this.seedQueue();\n    this.setState(s => ({ q: { t: s.q.t + 1 } }));\n  }\n\n  queueRows(live) {\n    if (!this.pts) this.seedQueue();\n    const names = [\"Green\", \"Yellow\", \"Red\"];\n    const colors = [\"#2E7D32\", \"#E08700\", \"#C8102E\"];\n    let list = this.pts.slice();\n    if (live) list.sort((a, b) => (b.unsure ? 0.99 : b.risk) - (a.unsure ? 0.99 : a.risk));\n    return list.map(p => {\n      const now = this.lane(p.risk);\n      const shown = live ? now : p.startLane;\n      let note;\n      if (live && p.unsure) note = \"Needs your eyes\";\n      else if (live && now > p.startLane) note = names[shown] + \" · moved up\";\n      else if (live) note = names[shown];\n      else note = p.mins > 60 ? names[p.startLane] + \" · not re-checked\" : names[p.startLane];\n      return { token: p.token, wait: p.mins + \" min waiting\", pct: Math.round(p.risk * 100), color: live ? (p.unsure ? \"#A100FF\" : colors[shown]) : \"#D9D9D9\", note };\n    });\n  }\n\n  runCard(key) {\n    clearInterval(this._ivs[\"c_\" + key]);\n    this._tos = this._tos || {};\n    clearTimeout(this._tos[key]);\n    this.setState(s => ({ cards: { ...s.cards, [key]: { c: 0, phase: \"talk\", qi: 0, answers: [], decision: \"\", askReason: false } } }));\n    this._ivs[\"c_\" + key] = setInterval(() => {\n      this.setState(s => {\n        const c = s.cards[key];\n        const n = this.cardWords.length;\n        if (c.c > n + 2) { clearInterval(this._ivs[\"c_\" + key]); return { cards: { ...s.cards, [key]: { ...c, c: c.c + 1, phase: \"ask\" } } }; }\n        return { cards: { ...s.cards, [key]: { ...c, c: c.c + 1 } } };\n      });\n    }, 210);\n  }\n\n  answerCard(key, ans) {\n    this.setState(s => {\n      const c = s.cards[key];\n      const answers = c.answers.concat([{ q: this.cardQuestions[c.qi], a: ans }]);\n      const done = answers.length >= this.cardQuestions.length;\n      if (done) {\n        this._tos = this._tos || {};\n        this._tos[key] = setTimeout(() => this.setState(s2 => ({ cards: { ...s2.cards, [key]: { ...s2.cards[key], phase: \"risk\" } } })), 500);\n      }\n      return { cards: { ...s.cards, [key]: { ...c, answers, qi: c.qi + 1, phase: done ? \"pause\" : \"ask\" } } };\n    });\n  }\n\n  cardAction(key, decision) { this.setState(s => ({ cards: { ...s.cards, [key]: { ...s.cards[key], decision, askReason: false } } })); }\n  cardAskReason(key) { this.setState(s => ({ cards: { ...s.cards, [key]: { ...s.cards[key], askReason: true, decision: \"\" } } })); }\n\n  cardVals(key, unsure) {\n    const c = this.state.cards[key];\n    const n = this.cardWords.length;\n    const ph = c.phase;\n    const asking = ph === \"ask\" && c.qi < this.cardQuestions.length;\n    return {\n      stageLabel: ph === \"talk\" ? \"Listening — she just talks\" : asking ? \"MediPilot asks for the missing detail\" : \"Read back before it commits\",\n      transcript: this.cardWords.slice(0, Math.min(c.c, n)).join(\" \") + (c.c <= n ? \" …\" : \"\"),\n      showFields: c.c > n,\n      answered: c.answers,\n      asking,\n      question: this.cardQuestions[c.qi] || \"\",\n      showRisk: ph === \"risk\",\n      showActions: ph === \"risk\" && !unsure,\n      askReason: c.askReason,\n      riskText: unsure ? \"No recommendation\" : \"Red · Bay 2\",\n      riskSub: unsure ? \"Range too wide, and this patient is unlike any it has seen. She goes to the top of your list, uncoloured.\" : \"0.63–0.78 chance of a critical event in 24h · start the clock\",\n      riskColor: unsure ? \"#A100FF\" : \"#C8102E\",\n      status: c.decision,\n      accept: () => this.cardAction(key, \"Accepted · bay alerted, treatment clock started\"),\n      moveUp: () => this.cardAction(key, \"Moved up · no reason needed to escalate\"),\n      moveDown: () => this.cardAskReason(key),\n      reasonA: () => this.cardAction(key, \"Overridden to Yellow · “vitals improved” logged and sent to training\"),\n      reasonB: () => this.cardAction(key, \"Overridden to Yellow · “pain settled” logged and sent to training\"),\n      reasonC: () => this.cardAction(key, \"Overridden to Yellow · “known chronic” logged and sent to training\"),\n      answerYes: () => this.answerCard(key, \"Yes\"),\n      answerNo: () => this.answerCard(key, \"No\"),\n      replay: () => this.runCard(key)\n    };\n  }\n\n  renderVals() {\n    const vals = {};\n    Object.keys(this.mascotLines).forEach(k => {\n      vals[k + \"Shown\"] = this.mascotLines[k].slice(0, this.state.mLines[k]);\n      vals[k + \"Typing\"] = this.state.mLines[k] < this.mascotLines[k].length;\n    });\n    vals.queueUnwatched = this.queueRows(false);\n    vals.queueLive = this.queueRows(true);\n    const mins0 = this.pts ? this.pts[0].mins : 0;\n    vals.queueUnwatchedClock = Math.floor(mins0 / 60) + \"h \" + (mins0 % 60) + \"m since anyone looked\";\n    vals.queueLiveClock = \"Re-scored \" + (this.state.q.t % 5) + \"s ago · next tick in \" + (5 - (this.state.q.t % 5)) + \"s\";\n    [[\"rule\", false], [\"bench\", false], [\"unsure\", true]].forEach(([k, u]) => {\n      const v = this.cardVals(k, u);\n      Object.keys(v).forEach(kk => { vals[k + \"_\" + kk] = v[kk]; });\n    });\n    return vals;\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
