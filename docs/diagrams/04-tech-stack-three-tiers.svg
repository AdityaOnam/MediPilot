<svg width="680" height="492" viewBox="0 0 680 492" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Three-tier deployment stack</title>
<desc>The bench edge box runs speech recognition, the risk models, a local offline store and the browser interface. The hospital tier runs the event stream, the wall board and phone interface, and the EHR bridge. The regional cloud runs the LLM node, the feature store, training pipelines and drift watchdogs. Across hospitals, only model updates travel, never patient data, and those updates flow back down to the bench.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:'Segoe UI',Arial,sans-serif;}
.t{font-size:14px;font-weight:400;fill:#1a1a1a;}
.ts{font-size:12px;font-weight:400;fill:#5f5e5a;}
.th{font-size:14px;font-weight:500;fill:#1a1a1a;}
.c-purple>rect,.c-purple>circle,.c-purple>ellipse{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.5;}
.c-purple>.th{fill:#3C3489;}.c-purple>.ts{fill:#534AB7;}
.c-teal>rect,.c-teal>circle,.c-teal>ellipse{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5;}
.c-teal>.th{fill:#085041;}.c-teal>.ts{fill:#0F6E56;}
.c-gray>rect,.c-gray>circle,.c-gray>ellipse{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.5;}
.c-gray>.th{fill:#444441;}.c-gray>.ts{fill:#5F5E5A;}
</style>
</defs>
<rect x="0" y="0" width="680" height="492" fill="#ffffff"/>

<rect x="64" y="40" width="556" height="98" rx="8" fill="none" stroke="#5f5e5a" stroke-width="0.5" stroke-dasharray="4 3" opacity="0.55"/>
<text class="th" x="80" y="62">At the bench — the edge box, works with no network</text>
<g class="c-teal"><rect x="80" y="74" width="120" height="48" rx="4"/><text class="th" x="140" y="96" text-anchor="middle">Speech</text><text class="ts" x="140" y="114" text-anchor="middle">Whisper INT8</text></g>
<g class="c-teal"><rect x="214" y="74" width="120" height="48" rx="4"/><text class="th" x="274" y="96" text-anchor="middle">Risk models</text><text class="ts" x="274" y="114" text-anchor="middle">LightGBM+ONNX</text></g>
<g class="c-teal"><rect x="348" y="74" width="120" height="48" rx="4"/><text class="th" x="408" y="96" text-anchor="middle">Local store</text><text class="ts" x="408" y="114" text-anchor="middle">SQLite</text></g>
<g class="c-teal"><rect x="482" y="74" width="120" height="48" rx="4"/><text class="th" x="542" y="96" text-anchor="middle">Screen</text><text class="ts" x="542" y="114" text-anchor="middle">Browser PWA</text></g>
<line x1="342" y1="138" x2="342" y2="150" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="64" y="154" width="556" height="98" rx="8" fill="none" stroke="#5f5e5a" stroke-width="0.5" stroke-dasharray="4 3" opacity="0.55"/>
<text class="th" x="80" y="176">In the hospital</text>
<g class="c-gray"><rect x="80" y="188" width="165" height="48" rx="4"/><text class="th" x="162" y="210" text-anchor="middle">Event stream</text><text class="ts" x="162" y="228" text-anchor="middle">Kafka, 5-min ticks</text></g>
<g class="c-gray"><rect x="259" y="188" width="165" height="48" rx="4"/><text class="th" x="341" y="210" text-anchor="middle">Board and phone</text><text class="ts" x="341" y="228" text-anchor="middle">Same PWA build</text></g>
<g class="c-gray"><rect x="438" y="188" width="165" height="48" rx="4"/><text class="th" x="520" y="210" text-anchor="middle">EHR bridge</text><text class="ts" x="520" y="228" text-anchor="middle">FHIR, CDS Hooks</text></g>
<line x1="342" y1="252" x2="342" y2="264" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="64" y="268" width="556" height="98" rx="8" fill="none" stroke="#5f5e5a" stroke-width="0.5" stroke-dasharray="4 3" opacity="0.55"/>
<text class="th" x="80" y="290">Regional cloud</text>
<g class="c-purple"><rect x="80" y="302" width="120" height="48" rx="4"/><text class="th" x="140" y="324" text-anchor="middle">LLM node</text><text class="ts" x="140" y="342" text-anchor="middle">8B, grammar</text></g>
<g class="c-purple"><rect x="214" y="302" width="120" height="48" rx="4"/><text class="th" x="274" y="324" text-anchor="middle">Features</text><text class="ts" x="274" y="342" text-anchor="middle">Feast + Redis</text></g>
<g class="c-purple"><rect x="348" y="302" width="120" height="48" rx="4"/><text class="th" x="408" y="324" text-anchor="middle">Training</text><text class="ts" x="408" y="342" text-anchor="middle">Argo, MLflow</text></g>
<g class="c-purple"><rect x="482" y="302" width="120" height="48" rx="4"/><text class="th" x="542" y="324" text-anchor="middle">Watchdogs</text><text class="ts" x="542" y="342" text-anchor="middle">Drift alarms</text></g>
<line x1="342" y1="366" x2="342" y2="378" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="c-teal"><rect x="64" y="382" width="556" height="90" rx="8"/><text class="th" x="342" y="406" text-anchor="middle">Across hospitals</text><text class="ts" x="342" y="426" text-anchor="middle">Only model updates travel — patient data never leaves the building</text><text class="ts" x="342" y="444" text-anchor="middle">Weekly federated rounds, secure aggregation, per-site calibration stays local</text></g>

<path d="M64 427 H52 V96 H60" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
</svg>
