<svg width="680" height="940" viewBox="0 0 680 940" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Vigil — the patient's journey through the corridor</title>
<desc>A patient walks through the ED doors down a corridor to the Vigil bench, where an eye and ear icon represent listening and seeing. The path forks into four colored streams by width: a thin red stream to resuscitation, a medium amber stream to a watched waiting bench with a pulsing five-minute recheck loop, a wide green stream to fast track, and a thin dashed teal stream that loops back up to a nurse icon instead of continuing forward. All three forward streams converge into a hospital cross marked Outcome. A thin dashed thread carries outcomes back up to the Vigil bench, closing the learning loop.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<linearGradient id="benchglow" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#F2A623" stop-opacity="0.35"/>
<stop offset="100%" stop-color="#F2A623" stop-opacity="0"/>
</linearGradient>
<style>
text{font-family:'Segoe UI',Arial,sans-serif;}
.ts{font-size:12px;font-weight:400;fill:#5f5e5a;}
.th{font-size:14px;font-weight:500;fill:#1a1a1a;}
</style>
</defs>
<rect x="0" y="0" width="680" height="940" fill="#ffffff"/>

<text class="th" x="340" y="30" text-anchor="middle" font-size="16">Vigil — the corridor is never unwatched</text>

<rect x="300" y="46" width="16" height="66" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="364" y="46" width="16" height="66" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<text class="ts" x="340" y="130" text-anchor="middle">Patient arrives</text>

<path d="M320 112 C310 150,300 180,310 210 C315 230,320 245,330 260" fill="none" stroke="#1a1a1a" stroke-width="0.5" opacity="0.4"/>
<path d="M360 112 C370 150,380 180,370 210 C365 230,360 245,350 260" fill="none" stroke="#1a1a1a" stroke-width="0.5" opacity="0.4"/>
<line x1="340" y1="130" x2="340" y2="248" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arrow)"/>

<ellipse cx="340" cy="300" rx="90" ry="80" fill="url(#benchglow)"/>
<g fill="#FAEEDA" stroke="#854F0B" stroke-width="1">
<circle cx="340" cy="300" r="46"/>
</g>
<ellipse cx="324" cy="290" rx="11" ry="7" fill="none" stroke="#4a3305" stroke-width="2"/>
<circle cx="324" cy="290" r="3" fill="#4a3305"/>
<path d="M354 284 Q362 288 362 296 Q362 304 354 308" fill="none" stroke="#4a3305" stroke-width="2" stroke-linecap="round"/>
<text class="th" x="340" y="332" text-anchor="middle" fill="#4a3305">Vigil</text>
<line x1="386" y1="285" x2="466" y2="230" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="2 2"/>
<text class="ts" x="472" y="226">Listens and sees</text>
<text class="ts" x="472" y="242">Never decides alone</text>

<line x1="290" y1="330" x2="290" y2="346" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

<path d="M310 346 C230 400,150 440,110 480" fill="none" stroke="#E24B4A" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
<path d="M330 346 C300 420,270 490,262 560" fill="none" stroke="#F2A623" stroke-width="26" stroke-linecap="round" opacity="0.85"/>
<path d="M355 346 C400 420,430 490,438 560" fill="none" stroke="#639922" stroke-width="34" stroke-linecap="round" opacity="0.85"/>
<path d="M382 316 C440 300,478 288,494 274" fill="none" stroke="#1D9E75" stroke-width="6" stroke-dasharray="4 5" stroke-linecap="round" opacity="0.85" marker-end="url(#arrow)"/>

<g fill="#FCEBEB" stroke="#A32D2D" stroke-width="1">
<circle cx="100" cy="500" r="30"/>
</g>
<path d="M92 500 H108 M100 492 V508" stroke="#791F1F" stroke-width="3" stroke-linecap="round"/>
<text class="ts" x="100" y="546" text-anchor="middle">Red</text>
<line x1="126" y1="490" x2="200" y2="440" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="2 2"/>
<text class="ts" x="206" y="436">Straight through, no queue</text>

<rect x="228" y="576" width="72" height="34" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<line x1="238" y1="610" x2="238" y2="622" stroke="#1a1a1a" stroke-width="2"/>
<line x1="290" y1="610" x2="290" y2="622" stroke="#1a1a1a" stroke-width="2"/>
<text class="ts" x="264" y="632" text-anchor="middle">Yellow</text>
<path d="M264 576 a20 20 0 1 1 0.1 0" fill="none" stroke="#F2A623" stroke-width="2" opacity="0.7"/>
<path d="M254 548 L260 540 L266 552 L272 536 L278 548 L284 542" fill="none" stroke="#F2A623" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
<line x1="300" y1="590" x2="470" y2="560" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="2 2"/>
<text class="ts" x="476" y="556">Waits, but watched</text>
<text class="ts" x="476" y="572">Re-checked every 5 min</text>
<text class="ts" x="476" y="588">Can only move up</text>

<rect x="404" y="576" width="72" height="46" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text class="ts" x="440" y="638" text-anchor="middle">Green</text>
<line x1="476" y1="595" x2="558" y2="638" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="2 2"/>
<text class="ts" x="564" y="634">Fast track</text>
<text class="ts" x="564" y="650">Told the true wait</text>

<g fill="#E1F5EE" stroke="#0F6E56" stroke-width="1">
<circle cx="520" cy="260" r="26"/>
</g>
<circle cx="513" cy="254" r="3" fill="#04342C"/>
<path d="M504 270 Q520 282 536 270" fill="none" stroke="#04342C" stroke-width="2" stroke-linecap="round"/>
<text class="ts" x="520" y="302" text-anchor="middle">Nurse decides</text>
<line x1="546" y1="248" x2="600" y2="200" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="2 2"/>
<text class="ts" x="500" y="176" text-anchor="middle">Not sure? No colour shown.</text>
<text class="ts" x="500" y="192" text-anchor="middle">Goes straight to her, full stop.</text>

<line x1="110" y1="528" x2="262" y2="586" stroke="#1a1a1a" stroke-width="0.5" opacity="0.35"/>
<line x1="298" y1="596" x2="410" y2="612" stroke="#1a1a1a" stroke-width="0.5" opacity="0.35"/>
<line x1="100" y1="530" x2="255" y2="700" stroke="#1a1a1a" stroke-width="0.6" opacity="0.4" marker-end="url(#arrow)"/>
<line x1="264" y1="632" x2="300" y2="700" stroke="#1a1a1a" stroke-width="0.6" opacity="0.4" marker-end="url(#arrow)"/>
<line x1="440" y1="622" x2="360" y2="700" stroke="#1a1a1a" stroke-width="0.6" opacity="0.4" marker-end="url(#arrow)"/>

<g fill="#FAECE7" stroke="#993C1D" stroke-width="1">
<circle cx="320" cy="740" r="40"/>
</g>
<path d="M320 720 V760 M300 740 H340" stroke="#4A1B0C" stroke-width="4" stroke-linecap="round"/>
<text class="th" x="320" y="800" text-anchor="middle">Outcome</text>
<text class="ts" x="320" y="818" text-anchor="middle">What actually happened to them</text>

<path d="M270 730 C120 700,60 500,60 300 C60 220,160 190,320 260" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 5" opacity="0.5" marker-end="url(#arrow)"/>
<text class="ts" x="30" y="500" transform="rotate(-90 30 500)" text-anchor="middle" opacity="0.7">Teaches Vigil</text>

<text class="ts" x="340" y="890" text-anchor="middle" opacity="0.75">One rule holds the whole loop together:</text>
<text class="th" x="340" y="912" text-anchor="middle">It can move a patient up on its own. Never down.</text>
</svg>
