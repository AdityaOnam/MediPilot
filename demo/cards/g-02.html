<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>G-02 — Throughput</title>
<style>
:root {
  --bg:#FBF7F2; --bg-card:#FFFFFF; --line:#E7DED2; --text:#1C1B1A; --text-dim:#6B6560;
  --accent:#DF423D; --focus:#926A47; --steel:#A7C4CC; --glass:#C9EBED;
  --acuity-red:#C62D26; --acuity-red-fill:#FBE7E5;
  --acuity-yellow:#9A6206; --acuity-yellow-fill:#FCF1DC;
  --acuity-green:#1B7A4B; --acuity-green-fill:#E4F4EB;
  --acuity-abstained:#5B4BC4; --acuity-abstained-fill:#ECE9FB;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; background:var(--bg); color:var(--text);
  font-family:-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif;
  font-variant-numeric:tabular-nums; overflow:hidden; }
.stage { position:relative; width:1920px; height:1080px; padding:100px 160px; }
.kicker { font-size:16px; font-weight:700; letter-spacing:3px; text-transform:uppercase;
  color:var(--text-dim); margin-bottom:26px; }
.chip { position:absolute; right:64px; bottom:48px; border:1.5px solid var(--steel); color:var(--focus);
  padding:9px 18px; border-radius:999px; font-size:13px; font-weight:700; letter-spacing:2px;
  background:rgba(167,196,204,0.14); }
.rule { width:100%; height:1px; background:var(--line); margin:36px 0; }

.headline { font-size:52px; font-weight:800; line-height:1.35; letter-spacing:-0.01em; }
.headline .num {
  background:linear-gradient(to right,var(--accent),var(--focus));
  -webkit-background-clip:text; background-clip:text; color:transparent; }

.grid { display:flex; gap:70px; margin-top:10px; }
.stat .n { font-size:52px; font-weight:800; }
.stat .l { font-size:19px; color:var(--text-dim); margin-top:10px; font-weight:600;
  text-transform:uppercase; letter-spacing:0.5px; }

.split { display:flex; gap:20px; margin-top:44px; }
.pill { display:flex; align-items:center; gap:10px; padding:12px 20px; border-radius:12px;
  font-size:24px; font-weight:700; border:1.5px solid transparent; }
.pill .glyph { font-size:20px; }
.pill-red    { background:var(--acuity-red-fill);    color:var(--acuity-red);    border-color:var(--acuity-red); }
.pill-yellow { background:var(--acuity-yellow-fill); color:var(--acuity-yellow); border-color:var(--acuity-yellow); }
.pill-green  { background:var(--acuity-green-fill);  color:var(--acuity-green);  border-color:var(--acuity-green); }
.pill-abstained { background:var(--acuity-abstained-fill); color:var(--acuity-abstained); border-color:var(--acuity-abstained); }

.zero-card { margin-top:52px; border-radius:20px; padding:32px 40px;
  background:linear-gradient(#FFFFFF,#FFFFFF) padding-box,
             linear-gradient(135deg,var(--accent),var(--focus),var(--steel)) border-box;
  border:2px solid transparent; display:flex; align-items:baseline; gap:28px; }
.zero-card .n { font-size:64px; font-weight:800; color:var(--text); }
.zero-card .txt .l { font-size:26px; font-weight:700; }
.zero-card .txt .l2 { font-size:19px; color:var(--text-dim); margin-top:4px; }
</style>
</head>
<body>
<div class="stage">
  <div class="kicker">Throughput &middot; one scripted run</div>

  <div class="headline"><span class="num">30</span> arrivals in <span class="num">40</span> minutes</div>

  <div class="rule"></div>

  <div class="grid">
    <div class="stat"><div class="n">3 min</div><div class="l">Median intake</div></div>
    <div class="stat"><div class="n">5</div><div class="l">Kiosks running at once</div></div>
    <div class="stat"><div class="n">5</div><div class="l">Routed straight to a nurse</div></div>
  </div>

  <div class="split">
    <div class="pill pill-red"><span class="glyph">&#9650;</span>4 Red</div>
    <div class="pill pill-yellow"><span class="glyph">&#9670;</span>11 Yellow</div>
    <div class="pill pill-green"><span class="glyph">&#9679;</span>13 Green</div>
    <div class="pill pill-abstained"><span class="glyph">&#9671;</span>2 Abstained</div>
  </div>

  <div class="zero-card">
    <div class="n">0</div>
    <div class="txt">
      <div class="l">de-escalated autonomously</div>
      <div class="l2">that path does not exist in the code</div>
    </div>
  </div>

  <div class="chip">SIMULATED DATA</div>
</div>
</body>
</html>
