<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>G-01 — Title</title>
<style>
:root {
  --bg:#FBF7F2; --bg-card:#FFFFFF; --line:#E7DED2; --text:#1C1B1A; --text-dim:#6B6560;
  --accent:#DF423D; --focus:#926A47; --steel:#A7C4CC; --glass:#C9EBED;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; background:var(--bg); color:var(--text);
  font-family:-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif;
  font-variant-numeric:tabular-nums; overflow:hidden; }
.stage { position:relative; width:1920px; height:1080px; display:flex; flex-direction:column;
  justify-content:center; padding:120px 160px; }
.chip { position:absolute; right:64px; bottom:48px; border:1.5px solid var(--steel); color:var(--focus);
  padding:9px 18px; border-radius:999px; font-size:13px; font-weight:700; letter-spacing:2px;
  background:rgba(167,196,204,0.14); }

.mark { width:64px; height:64px; border-radius:14px;
  background:linear-gradient(135deg,var(--accent),var(--focus));
  display:flex; align-items:center; justify-content:center; color:#fff; font-size:34px;
  font-weight:800; margin-bottom:36px; }

.title { font-size:104px; font-weight:800; letter-spacing:-0.02em; line-height:1; }
.sub { font-size:34px; font-weight:600; margin-top:20px;
  background:linear-gradient(to right,var(--accent),var(--focus));
  -webkit-background-clip:text; background-clip:text; color:transparent; }
.team { font-size:24px; color:var(--text-dim); margin-top:44px; font-weight:500; }
</style>
</head>
<body>
<div class="stage">
  <div class="mark">+</div>
  <div class="title">MediPilot</div>
  <div class="sub">PatientTriage.ai</div>
  <div class="team">Team 01 BIT &middot; IIT Patna &middot; Accenture Innovation Challenge 2026</div>
  <div class="chip">SIMULATED DATA</div>
</div>
</body>
</html>
