# Surge controller policy configuration
# Surge is defined as 3× normal arrival rate sustained over a rolling window.

detection:
  normal_arrival_rate_per_hour: 8        # baseline for this ED (configurable per site)
  surge_multiplier_threshold: 3.0        # 3× triggers surge mode
  measurement_window_minutes: 20         # rolling window for rate calculation
  exit_threshold_multiplier: 2.0         # drop below 2× to exit surge

stretch_policy:
  # What stretches under surge (applied on top of band_cadence.yaml base values)
  yellow_remeasure_stretch_s: 900        # 30m → 45m (+15m)
  green_remeasure_stretch_s: 1800        # 60m → 90m (+30m)
  red_remeasure_stretch_s: 0             # NEVER stretches

# Forbidden under any load condition — enforced in surge_controller.py code:
forbidden_actions:
  - raise_cost_ratio_R                   # never raise R to reduce alarm volume
  - resolve_abstention_by_guessing       # abstention always routes to human
  - deescalate_to_free_capacity          # never lower a band to reduce queue pressure

# Alert ranking under surge: risk × time_waiting (never suppressed)
alert_ranking_formula: "risk_score * (time_waiting_seconds / 60.0)"

# Logging
surge_log:
  log_entry_on_surge_start: true
  log_entry_on_surge_exit: true
  fields:
    - timestamp_utc
    - trigger_metric                     # arrival rate that triggered
    - mode                               # entered / exited
    - active_policy_snapshot             # what cadences are in effect
